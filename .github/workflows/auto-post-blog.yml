name: Auto Post New Blog Posts

on:
  push:
    branches: [master, main]
    paths:
      - 'src/posts/**/*.md'

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Detect new blog posts
      id: detect-new-posts
      run: |
        # Get the list of changed files in the src/posts directory
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'src/posts/**/*.md' || echo "")
        
        # Filter for newly added files (not modified)
        NEW_FILES=""
        for file in $CHANGED_FILES; do
          if git diff --name-status HEAD~1 HEAD -- "$file" | grep -q "^A"; then
            NEW_FILES="$NEW_FILES $file"
          fi
        done
        
        echo "new_posts=$NEW_FILES" >> $GITHUB_OUTPUT
        echo "New blog posts detected: $NEW_FILES"
    
    - name: Process and post new blogs
      if: steps.detect-new-posts.outputs.new_posts != ''
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL || 'https://www.shahsyed.com' }}
      run: |
        node scripts/post-to-social.cjs "${{ steps.detect-new-posts.outputs.new_posts }}"